name: build

# 拉取 → 合并 → 编译 → 自检 → 发布到 dist（单提交强推）。
on:
  schedule:
    # 上游 MetaCubeX/meta-rules-dat 的 cron 是 22:30 UTC，实际发布常拖到 01:00–02:00 UTC 前后；
    # 这里定在 03:17 UTC（北京时间 11:17），留出余量，避开整点排队。
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "scripts/**"
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "tests/**"
      - "examples/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "跳过「条目数骤降 >30%」检查，强制发布（确认上游确实大改时用）"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || 'dist' }}
  cancel-in-progress: false

env:
  # mihomo 固定版本 + 校验哈希（升级时两行一起改，哈希取自 release 资产的 sha256）
  MIHOMO_VERSION: v1.19.33
  MIHOMO_ASSET: mihomo-linux-amd64-v1-v1.19.33.gz
  MIHOMO_SHA256: 8ec92e7b2fdc6b853ba00156bab7e4e965c8b0d843b8c4ac8ab98795f02ad524
  BUILD_DIR: ${{ github.workspace }}/build

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依赖
        run: pip install pyyaml==6.0.2

      - name: 安装 mihomo（固定版本 + sha256 校验）
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/mihomo.gz" \
            "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/${MIHOMO_ASSET}"
          echo "${MIHOMO_SHA256}  $RUNNER_TEMP/mihomo.gz" | sha256sum -c -
          gunzip -c "$RUNNER_TEMP/mihomo.gz" > "$RUNNER_TEMP/bin/mihomo"
          chmod +x "$RUNNER_TEMP/bin/mihomo"
          "$RUNNER_TEMP/bin/mihomo" -v

      - name: 单元测试
        run: python -m unittest discover -s tests -v

      - name: 示例配置能被 mihomo 解析
        run: |
          d=$(mktemp -d); cp examples/config.yaml "$d/"
          "$RUNNER_TEMP/bin/mihomo" -t -d "$d" -f "$d/config.yaml"

      - name: 取当前 dist（上次好的版本）
        run: |
          mkdir -p "$RUNNER_TEMP/prev"
          if git fetch --depth=1 origin dist 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/prev"
            echo "有上次的 dist：$(git rev-parse FETCH_HEAD)"
          else
            echo "还没有 dist 分支（首次发布）"
          fi

      - name: 拉取
        run: python scripts/fetch.py

      - name: 合并
        id: merge
        run: |
          set +e
          python scripts/merge.py
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # 2 = 自有规则写法错误：继续走完（其余规则集照常发布、开 issue），最后让 job 变红
          [ "$rc" = 0 ] || [ "$rc" = 2 ]

      - name: 编译 + 自检 + 组装 dist
        id: build
        run: |
          set +e
          FORCE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then FORCE="--force"; fi
          python scripts/build.py --mihomo "$RUNNER_TEMP/bin/mihomo" --out "$RUNNER_TEMP/dist" --prev "$RUNNER_TEMP/prev" $FORCE
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          {
            echo "### 规则集"
            echo
            echo "| 规则集 | 状态 | 条目 | 公开来源里跳过 |"
            echo "|---|---|---|---|"
            jq -r '.sets | to_entries[] | "| \(.key) | \(.value.state) | \(.value.count // "-") | \((.value.skipped // {}) | to_entries | map("\(.key) \(.value)") | join(", ")) |"' "$RUNNER_TEMP/dist/manifest.json"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: 发布到 dist（孤儿单提交，强推）
        if: github.event_name != 'pull_request' && steps.build.outputs.rc == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          new=$(jq -r .content_hash "$RUNNER_TEMP/dist/manifest.json")
          old=$(jq -r '.content_hash // empty' "$RUNNER_TEMP/prev/manifest.json" 2>/dev/null || true)
          if [ "$new" = "$old" ]; then
            echo "内容与当前 dist 相同，不发布。"
            exit 0
          fi
          up=$(jq -r ".upstream.metacubex.commit // \"-\"" "$RUNNER_TEMP/dist/manifest.json")
          cd "$RUNNER_TEMP/dist"
          git init -q -b dist
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "发布规则集 $(date -u +%Y-%m-%dT%H:%MZ)（main ${GITHUB_SHA::7}，上游 ${up::7}）"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push --force "https://github.com/${GITHUB_REPOSITORY}.git" dist:dist
          git ls-files | wc -l

      - name: 维护滚动 issue
        if: always() && github.event_name != 'pull_request' && hashFiles('build/status.json') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/issues.py

      - name: 结果
        if: always()
        run: |
          fails=$(jq -r '[.sets[] | select(.ok | not) | .set] | join(", ")' build/status.json 2>/dev/null || echo "?")
          echo "失败的规则集：${fails:-无}"
          [ "${{ steps.merge.outputs.rc }}" = "0" ] || { echo "::error::自有规则有写法错误，见「合并」步骤"; exit 1; }
          [ "${{ steps.build.outputs.rc }}" = "0" ] || { echo "::error::dist 终检没过，本次未发布"; exit 1; }
          [ -z "$fails" ] || { echo "::error::以下规则集本次未更新（保留上次版本）：$fails"; exit 1; }
