# 规则集清单：机器人只拉这里列出的来源（不全网爬）。加来源、加规则集都走 PR 改这个文件。
#
# repos：上游仓库。每次构建先把分支解析成一个固定 commit，同一次构建的所有文件都按这个 commit 下载。
#
# sets：每个规则集
#   name      基础名（小写、连字符），产出 release 分支 <kind>/<name>.{yaml,mrs}
#   kind      geosite（behavior: domain）或 geoip（behavior: ipcidr）
#   provider  配置里的 rule-provider 名（示例配置与 README 用）
#   upstream  公开来源列表（可多个、可为空），每项：
#     repo    上面 repos 里的名字（按固定 commit 拉）；或者改写 url: 直接给完整地址（不固定 commit）
#     path    仓库内路径（.yaml = payload: 列表；.list / .txt = 每行一条）
#     format  payload   —— MetaCubeX 那种明文：domain 规则集是 域名 / +.域名，ipcidr 规则集是网段
#             classical —— Clash classical 写法（DOMAIN-SUFFIX,x / DOMAIN,x / IP-CIDR,x …，如 blackmatrix7/ios_rule_script）
#   公开来源里编不进 MRS 的行（DOMAIN-KEYWORD、DOMAIN-REGEX、PROCESS-NAME、geosite 里的 IP 行等）跳过并计数，
#   写进 release 分支 manifest.json 的 skipped；不报错。
#   exclude  可选的排除列表（只对 geosite 有效）：裸域名后缀，如 amazonaws.com；合并后去掉
#     等于该后缀或属于它的子域的条目，`+.x` 与 `x` 写法都按裸域名算，去掉的条数记进
#     manifest.json 的 excluded。注意：排除只能去掉单独列出的条目，`+.父域` 自身匹配到
#     的子域去不掉（如 `+.amazon.com` 仍会匹配 aws.amazon.com，想排掉须让它在上游单独列出）。
# 自有规则：<kind>/<name>.yaml（仓库根目录） 存在就自动并入，无需在这里登记；自有规则写错是硬错误。
repos:
  metacubex: { repo: MetaCubeX/meta-rules-dat, branch: meta }

sets:
  - { name: overseas,     kind: geosite, provider: Overseas_mrs,     upstream: [{ repo: metacubex, path: "geo/geosite/geolocation-!cn.yaml", format: payload }] }
  - { name: cn,           kind: geosite, provider: CN_mrs,           upstream: [{ repo: metacubex, path: "geo/geosite/cn.yaml", format: payload }] }
  - { name: cn,           kind: geoip,   provider: IP_CN_mrs,        upstream: [{ repo: metacubex, path: "geo/geoip/cn.yaml", format: payload }] }
  - name: ai
    kind: geosite
    provider: AI_mrs
    upstream:
      - { repo: metacubex, path: "geo/geosite/category-ai-!cn.yaml", format: payload }
      - { repo: metacubex, path: "geo/geosite/anthropic.yaml", format: payload }
      - { repo: metacubex, path: "geo/geosite/apple-intelligence.yaml", format: payload }
      - { repo: metacubex, path: "geo/geosite/cursor.yaml", format: payload }
      - { repo: metacubex, path: "geo/geosite/github-copilot.yaml", format: payload }
      - { repo: metacubex, path: "geo/geosite/google-gemini.yaml", format: payload }
      - { repo: metacubex, path: "geo/geosite/huggingface.yaml", format: payload }
      - { repo: metacubex, path: "geo/geosite/jetbrains-ai.yaml", format: payload }
      - { repo: metacubex, path: "geo/geosite/openai.yaml", format: payload }
      - { repo: metacubex, path: "geo/geosite/perplexity.yaml", format: payload }
      - { repo: metacubex, path: "geo/geosite/poe.yaml", format: payload }
      - { repo: metacubex, path: "geo/geosite/windsurf.yaml", format: payload }
      - { repo: metacubex, path: "geo/geosite/xai.yaml", format: payload }
    # 排除：上游 AI 分类里混进来的国产 AI 应用域名（Gray 立规：拒用国产 AI）与素材市场整站
    exclude:
      - cici.com
      - ciciai.com
      - ciciaicdn.com
      - coze.com
      - dify.ai
      - dola.com
      - envato-static.com
      - envato.com
      - envatousercontent.com
      - kimi.ai
      - manus.im
      - manuscdn.com
      - marscode.com
      - minimax.io
      - moonshot.ai
      - qoder.com
      - tapnow.ai
      - themeforest.net
      - trae.ai
      - tripo3d.ai
  - name: google
    kind: geosite
    provider: Google_mrs
    upstream:
      - { repo: metacubex, path: "geo/geosite/google.yaml", format: payload }
    # 排除：非 Google 服务（个人博客子域、腾讯云整站）
    exclude: [oasisfeng.com, txcloud.net]
  - { name: google,       kind: geoip,   provider: IP_Google_mrs,    upstream: [{ repo: metacubex, path: "geo/geoip/google.yaml", format: payload }] }
  - { name: samsung,      kind: geosite, provider: Samsung_mrs,      upstream: [{ repo: metacubex, path: "geo/geosite/samsung.yaml", format: payload }] }
  - { name: galaxy-store, kind: geosite, provider: Galaxy_Store_mrs, upstream: [] }
  - { name: oracle,       kind: geosite, provider: Oracle_mrs,       upstream: [] }
  - name: nintendo
    kind: geosite
    provider: Nintendo_mrs
    upstream:
      - { repo: metacubex, path: "geo/geosite/nintendo.yaml", format: payload }
    # 排除：非任天堂自有服务（破解教程站、同人站、仿冒域名）
    exclude: [dkr.com, hackyourconsole.com, nentindo.net]
  - { name: private,      kind: geosite, provider: Private_mrs,      upstream: [{ repo: metacubex, path: "geo/geosite/private.yaml", format: payload }] }
  - { name: private,      kind: geoip,   provider: IP_Private_mrs,   upstream: [{ repo: metacubex, path: "geo/geoip/private.yaml", format: payload }] }
  - { name: ntp,          kind: geosite, provider: NTP_mrs,          upstream: [{ repo: metacubex, path: "geo/geosite/category-ntp.yaml", format: payload }] }
  - { name: ads,          kind: geosite, provider: Ads_mrs,          upstream: [{ repo: metacubex, path: "geo/geosite/category-ads-all.yaml", format: payload }] }
  - name: amazon
    kind: geosite
    provider: Amazon_mrs
    upstream:
      - { repo: metacubex, path: "geo/geosite/amazon.yaml", format: payload }
    # 排除：上游 amazon 分类自带的 AWS 相关及广告系统域（零售规则不要）
